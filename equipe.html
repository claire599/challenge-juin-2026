<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ WD France — La Sélection</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800;900&family=Audiowide&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:#06160d;color:#fff}

#film{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 25%, rgba(20,80,47,.6), rgba(6,16,12,.98));}
/* pelouse rayée en bas */
#film::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;
  background:repeating-linear-gradient(90deg,#1f7a44 0 60px,#1c6f3e 60px 120px);
  opacity:.5;mask:linear-gradient(to top,#000,transparent)}
/* projecteurs */
.beam{position:absolute;top:-30%;width:70px;height:170%;background:linear-gradient(to bottom,rgba(255,255,255,.14),transparent);filter:blur(10px);transform-origin:top center;pointer-events:none}
.beam.b1{left:16%;animation:sw1 3.2s ease-in-out infinite}
.beam.b2{left:50%;animation:sw2 3.6s ease-in-out infinite}
.beam.b3{left:82%;animation:sw1 4s ease-in-out infinite reverse}
@keyframes sw1{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
@keyframes sw2{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-11deg)}}

#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;padding:24px;text-align:center}

/* INTRO / FINAL */
.big-title{font-family:'Bebas Neue',sans-serif;line-height:.92;letter-spacing:4px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.kick{font-size:clamp(3rem,13vw,7rem)}
.kick .fr1{color:#3b7dd8}.kick .fr2{color:#fff}.kick .fr3{color:#ef4135}
.kick .gold{color:#f9ca24}
.tagline{font-family:'Audiowide',sans-serif;font-size:clamp(.9rem,3.5vw,1.5rem);color:#bfe6cd;margin-top:14px;letter-spacing:1px}
.appear{animation:appear .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes appear{0%{opacity:0;transform:translateY(28px) scale(.85)}100%{opacity:1;transform:none}}

/* CARTE JOUEUR */
.player{display:flex;flex-direction:column;align-items:center;gap:6px}
.player .pnum-bg{position:absolute;font-family:'Bebas Neue',sans-serif;font-size:clamp(16rem,44vw,30rem);color:rgba(255,255,255,.05);z-index:0;top:50%;left:50%;transform:translate(-50%,-54%);pointer-events:none;line-height:1}
.bust{width:clamp(220px,46vw,340px);height:auto;z-index:1;filter:drop-shadow(0 14px 26px rgba(0,0,0,.5));animation:bustIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bustIn{0%{opacity:0;transform:translateY(40px) scale(.7) rotate(-4deg)}100%{opacity:1;transform:none}}
.pname{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.6rem,11vw,5rem);letter-spacing:3px;line-height:.9;z-index:1;text-shadow:0 4px 18px rgba(0,0,0,.6);animation:appear .6s .15s both}
.prole{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:50px;padding:7px 18px;font-weight:800;font-size:clamp(.85rem,3.4vw,1.25rem);letter-spacing:.5px;z-index:1;animation:appear .6s .3s both}
.prole.bleus{background:linear-gradient(90deg,rgba(0,85,164,.35),rgba(239,65,53,.35));border-color:#f9ca24;color:#f9ca24}
.pheart{font-size:clamp(1rem,4vw,1.4rem);color:#ff9 db;margin-top:2px;z-index:1;animation:appear .6s .45s both;font-weight:800}

/* sous-titres voix off */
#sub{position:absolute;left:0;right:0;bottom:74px;text-align:center;z-index:4;padding:0 20px}
#sub span{display:inline-block;background:rgba(6,16,12,.82);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 18px;font-size:clamp(.85rem,3.2vw,1.2rem);font-weight:600;color:#eafaf0;max-width:880px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.4)}

/* bandeau broadcast haut */
#topbar{position:absolute;top:0;left:0;right:0;height:5px;z-index:5;background:linear-gradient(90deg,#0055a4,#fff,#ef4135)}
#live{position:absolute;top:16px;left:18px;z-index:5;display:flex;align-items:center;gap:6px;background:#d63031;border-radius:50px;padding:4px 12px;font-size:.7rem;font-weight:800;letter-spacing:1px}
#live .d{width:7px;height:7px;border-radius:50%;background:#fff;animation:bk 1.1s infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.2}}

/* contrôles */
#ctrl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:10px}
#ctrl button{border:none;border-radius:50px;padding:10px 20px;font-family:'Outfit',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;color:#0e2a18;letter-spacing:.5px}
.b-replay{background:linear-gradient(135deg,#f9ca24,#f0932b)}
.b-full{background:#fff}
#hint{position:absolute;bottom:58px;left:0;right:0;text-align:center;z-index:6;font-size:.66rem;color:rgba(255,255,255,.45);font-weight:600}
</style>
</head>
<body>
<div id="film">
  <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
  <canvas id="cv"></canvas>
  <div id="topbar"></div>
  <div id="live"><span class="d"></span>LIVE · STUDIO WD</div>
  <div id="stage"></div>
  <div id="sub"></div>
  <div id="hint">🎬 Pour la vidéo : passe en plein écran et enregistre l'écran (Win+Alt+R / OBS), puis ajoute voix off + sons (sifflet, foule, fanfare) dans CapCut</div>
  <div id="ctrl">
    <button class="b-replay" onclick="play()">▶ Rejouer</button>
    <button class="b-full" onclick="goFull()">⛶ Plein écran</button>
  </div>
</div>

  {name:'SYLVAIN',       num:10,role:'🧠 Capitaine · Meneur de jeu',  head:HEADS.homme,    sub:'Le capitaine, numéro 10 : SYLVAIN ! Le meneur qui donne le tempo et oriente le jeu.'},
  {name:'MARIE-JUSTINE', num:4, role:'🅰️ Passes décisives · RDV',     head:HEADS.brunfonce,sub:'Numéro 4, au cœur du jeu : MARIE-JUSTINE ! Reine de la passe décisive — chaque RDV transféré, c\'est un caviar pour l\'équipe.'},
  {name:'CORALIE',       num:11,role:'💙 Dernière sélection',          head:HEADS.blonde,   heart:'Merci pour tout, et bonne route 💙', bleus:true, sub:'Et pour sa toute dernière sélection sous le maillot, numéro 11 : CORALIE ! Une dernière danse avant de tourner la page… merci pour tout. 💙'}
];

/* ===== CONFETTIS ===== */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),parts=[],raf=null,until=0,cols=[];
function rsz(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',rsz);rsz();
function burst(c,d){cols=c;until=performance.now()+d;if(!raf)loop();}
function sp(){var l=Math.random()<.5;parts.push({x:l?innerWidth*.15:innerWidth*.85,y:innerHeight*.9,vx:(l?1:-1)*(Math.random()*7+4),vy:-(Math.random()*15+13),g:.42+Math.random()*.2,s:Math.random()*8+5,r:Math.random()*360,vr:(Math.random()-.5)*20,c:cols[(Math.random()*cols.length)|0],sh:Math.random()<.5,life:1});}
function loop(){raf=requestAnimationFrame(loop);ctx.clearRect(0,0,cv.width,cv.height);var n=performance.now();if(n<until)for(var i=0;i<5;i++)sp();
  parts.forEach(function(p){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;if(p.y>innerHeight*.55)p.life-=.012;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle=p.c;if(p.sh)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill();}ctx.restore();});
  parts=parts.filter(function(p){return p.life>0&&p.y<innerHeight+40;});
  if(n>=until&&!parts.length){cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,cv.width,cv.height);}}

/* ===== TIMELINE ===== */
var stage=document.getElementById('stage'),sub=document.getElementById('sub'),timers=[];
function setSub(t){sub.innerHTML=t?'<span>'+t+'</span>':'';}
function clearT(){timers.forEach(clearTimeout);timers=[];}
function at(ms,fn){timers.push(setTimeout(fn,ms));}

function scIntro(){
  stage.innerHTML='<div><div class="big-title kick appear"><span class="gold">WEDIVORCE</span></div>'+
    '<div class="big-title appear" style="font-size:clamp(1.4rem,6vw,3rem);letter-spacing:3px;margin-top:8px;color:#fff">⚽ LA SÉLECTION ⚽</div>'+
    '<div class="tagline appear">Le Grand Match · Juin 2026</div></div>';
  setSub('Bienvenue dans le stade du Grand Match ! Juin 2026… voici votre sélection Wedivorce !');
  burst(['#0055a4','#fff','#ef4135','#f9ca24'],1200);
}
function scPlayer(p){
  stage.innerHTML='<div class="player"><div class="pnum-bg">'+p.num+'</div>'+
    bustSVG(p.head,p.num)+
    '<div class="pname">'+p.name+'</div>'+
    '<div class="prole'+(p.bleus?' bleus':'')+'">'+p.role+'</div>'+
    (p.heart?'<div class="pheart">'+p.heart+'</div>':'')+
    '</div>';
  setSub(p.sub);
  burst(p.bleus?['#0055a4','#fff','#ef4135','#f9ca24']:['#3ee08a','#f9ca24','#fff'],900);
}
function scFinal(){
  stage.innerHTML='<div><div class="big-title kick appear"><span class="fr1">ALLEZ</span> <span class="fr2">WED</span><span class="fr3">IVORCE</span></div>'+
    '<div class="tagline appear">5 joueurs · 1 équipe · 1 objectif : la victoire 🏆</div></div>';
  setSub('Cinq joueurs, une équipe, un objectif : la victoire. Allez Wedivorce !');
  burst(['#0055a4','#fff','#ef4135','#f9ca24'],2400);
}

function play(){
  clearT();var t=0,INTRO=5000,P=4600,FIN=6000;
  scIntro();t+=INTRO;
  TEAM.forEach(function(p){at(t,function(){scPlayer(p);});t+=P;});
  at(t,function(){scFinal();});
}
function goFull(){var e=document.getElementById('film');if(e.requestFullscreen)e.requestFullscreen();else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();}
play();

</script>
